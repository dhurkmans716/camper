<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Whisky · Camperplaats reserveren</title>
<style>
  :root{
    --green:#1c1c1c; --green-dark:#000000; --green-soft:#ededed;
    --cream:#f7f4ec; --amber:#d98a2b; --ink:#2b2b28; --muted:#7a7a70;
    --line:#e2ddd0; --white:#ffffff; --shadow:0 6px 24px rgba(44,82,40,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5;padding:24px 16px}
  .wrap{max-width:920px;margin:0 auto}
  .card{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .head{background:var(--green);color:#fff;padding:22px 26px;position:relative}
  .head h1{font-size:20px;font-weight:650;letter-spacing:.2px}
  .head p{font-size:14px;opacity:.9;margin-top:4px;max-width:80%}
  .langs{position:absolute;top:16px;right:54px;display:flex;gap:4px;z-index:3}
  .langs button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;font-size:12px;font-weight:600;padding:4px 8px;border-radius:7px;cursor:pointer;font-family:inherit}
  .langs button.active{background:#fff;color:#1c1c1c;border-color:#fff}
  .body{display:grid;grid-template-columns:1fr 320px;gap:0}
  @media (max-width:760px){.body{grid-template-columns:1fr}}
  .cal{padding:22px 26px;border-right:1px solid var(--line)}
  @media (max-width:760px){.cal{border-right:none;border-bottom:1px solid var(--line)}}
  .prompt{font-size:13px;color:var(--green-dark);background:var(--green-soft);padding:8px 12px;border-radius:9px;margin-bottom:14px;text-align:center;font-weight:600}
  .prompt.warn{background:#fbeee6;color:#c07b3d}
  .calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .calnav h2{font-size:16px;font-weight:600;text-transform:capitalize}
  .navbtn{border:1px solid var(--line);background:#fff;width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:16px;color:var(--green-dark);display:flex;align-items:center;justify-content:center}
  .navbtn:hover{background:var(--green-soft)}
  .navbtn:disabled{opacity:.3;cursor:not-allowed}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .dow span{text-align:center;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .day{aspect-ratio:1/1;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;position:relative;transition:background .1s,border-color .1s;user-select:none}
  .day:hover:not(.disabled):not(.busy){border-color:var(--green)}
  .day.empty{border:none;background:transparent;cursor:default}
  .day.disabled{color:#c7c2b6;background:#faf8f3;cursor:not-allowed}
  .day.busy{color:#c07b3d;background:repeating-linear-gradient(45deg,#fbeee6,#fbeee6 4px,#f6e3d6 4px,#f6e3d6 8px);cursor:not-allowed;border-color:#f0d9c8}
  .day.busy::after{content:attr(data-full);position:absolute;bottom:3px;font-size:8px;color:#c07b3d;letter-spacing:.3px}
  .day.preview{background:var(--green-soft);border-color:var(--green-soft)}
  .day.night{background:var(--green);color:#fff;border-color:var(--green-dark)}
  .day.start{background:var(--green);color:#fff;border-color:var(--green-dark);font-weight:600}
  .day.end{background:#fff;color:var(--green-dark);border:2px solid var(--green);font-weight:600}
  .day.previewEnd{background:#fff;border:2px dashed var(--green);color:var(--green-dark)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .side{padding:22px 24px;display:flex;flex-direction:column}
  .side h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:12px}
  .stay{background:var(--cream);border-radius:11px;padding:12px 14px;margin-bottom:6px}
  .stay .line{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:3px 0}
  .stay .line .lbl{color:var(--muted)}
  .stay .line .val{font-weight:600}
  .stay .nights-badge{text-align:center;margin-top:6px;font-size:13px;color:var(--green-dark);font-weight:600}
  .stay .empty-msg{color:var(--muted);font-size:13px;font-style:italic;text-align:center;padding:6px 0}
  .field{margin:10px 0}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
  .field input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit}
  .field input:focus{outline:none;border-color:var(--green)}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:17px;cursor:pointer;color:var(--green-dark)}
  .stepper button:hover{background:var(--green-soft)}
  .stepper span{font-size:15px;font-weight:600;min-width:22px;text-align:center}
  .totals{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px}
  .totals .row{display:flex;justify-content:space-between;margin:4px 0;color:var(--muted)}
  .totals .grand{display:flex;justify-content:space-between;margin-top:8px;font-size:18px;font-weight:700;color:var(--ink)}
  .pay{margin-top:16px;width:100%;background:var(--amber);color:#fff;border:none;padding:14px;border-radius:11px;font-size:15px;font-weight:650;cursor:pointer;transition:.12s}
  .pay:hover{background:#c67c22}
  .pay:disabled{background:#d8cdbb;cursor:not-allowed}
  .reset{margin-top:8px;width:100%;background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline}
  .hint{font-size:11px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.4}
  .optin{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink);margin:8px 0 2px;cursor:pointer;line-height:1.35}
  .optin input{margin-top:2px;flex-shrink:0}
  @media(max-width:560px){ .head{padding:20px 20px} .head h1{font-size:17px;padding-right:150px} .head p{font-size:13px;max-width:100%;margin-top:6px} .langs{top:14px;right:50px} .langs button{padding:3px 6px;font-size:11px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <div class="langs" id="langs">
        <button data-lang="nl">NL</button>

        <div class="field">

        <button class="reset" id="resetBtn" style="display:none"></button>

      </div>
    </div>
  </div>
</div>

/* ====== VERTALINGEN ====== */

    legendNight:'Nacht (gebucht)', legendDep:'Abreisetag', legendFull:'Ausgebucht',

    arrival:'Anreise', departure:'Abreise', night:'Nacht', nights:'Nächte',
    persons:'Anzahl Personen', nameLabel:'Name', namePh:'Vor- und Nachname', emailLabel:'E-Mail', emailPh:'du@beispiel.de', keepPosted:'Halte mich über Neuigkeiten und Angebote auf dem Laufenden',
    nightsCalc:function(n,p){return n+' '+(n===1?'Nacht':'Nächte')+' × '+p;},
    tax:function(p){return 'Kurtaxe ('+p+' Pers.)';}, power:'Strom 6A', total:'Gesamt',
    payBtn:function(t){return t+' bezahlen und buchen';}, chooseFirst:'Wähle zuerst deine Daten', sending:'Weiterleitung…', reset:'neu wählen',

    errBijbetalen:'Für mehr Nächte ist eine Nachzahlung nötig — bitte kontaktiere uns unter info@buswhisky.com, dann regeln wir das.'

};

/* taal bepalen: ?lang= , anders browsertaal, anders nl */
function detectLang(){
  try{ var fl=window.frameElement && window.frameElement.getAttribute('data-lang'); if(fl){ fl=fl.toLowerCase().slice(0,2); if(T[fl]) return fl; } }catch(e){}
  var q=(new URLSearchParams(location.search)).get('lang');
  if(q){ q=q.toLowerCase().slice(0,2); if(T[q]) return q; }
  var b=(navigator.language||'nl').toLowerCase().slice(0,2);
  return T[b]?b:'nl';
}
let lang=detectLang();
function L(){ return T[lang]; }
const _WQ=new URLSearchParams(location.search);
const WIJZIG={ on:(_WQ.get('wijzig')==='1' && !!_WQ.get('ref') && !!_WQ.get('token')), ref:_WQ.get('ref'), token:_WQ.get('token') };

const today = new Date(2026,7,11); today.setHours(0,0,0,0);
let view = new Date(today.getFullYear(), today.getMonth(), 1);
let persons = 2, checkIn=null, checkOut=null, hoverDate=null, cells=[];
let BUSY = new Set(CONFIG.busy);

const money = n => { var s=Number(n).toFixed(2).replace('.', L().dec); return '€'+s; };
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dLong = d => d.toLocaleDateString(L().locale,{weekday:"long",day:"numeric",month:"long"});
const sameDay = (a,b) => a && b && a.getTime()===b.getTime();
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const dayMs = 86400000;
const nightsCount = (a,b) => a&&b ? Math.round((b-a)/dayMs) : 0;

function rangeHasBusy(a,b){ for(let d=new Date(a); d<b; d=addDays(d,1)){ if(d<today) return true; if(BUSY.has(iso(d))) return true; } return false; }

async function loadAvailability(fromDate){
  try{
    var start = (fromDate && fromDate>today) ? new Date(fromDate) : new Date(today);
    var van = iso(start);
    var end = iso(addDays(start,42));
    var res = await fetch(CONFIG.beschikbaarheidUrl+"?van="+van+"&dagen=42");
    var data = await res.json().catch(function(){return {};});
    var vol = (data && Array.isArray(data.vol)) ? data.vol : [];
    Array.from(BUSY).forEach(function(d){ if(d>=van && d<end) BUSY.delete(d); });
    vol.forEach(function(d){ BUSY.add(String(d).slice(0,10)); });
    buildGrid();
  }catch(e){ }
}

function buildGrid(){
  const cap = view.toLocaleDateString(L().locale,{month:"long",year:"numeric"});
  document.getElementById("monthLabel").textContent = cap.charAt(0).toUpperCase()+cap.slice(1);
  const grid=document.getElementById("grid"); grid.innerHTML=""; cells=[];
  const first=new Date(view.getFullYear(), view.getMonth(), 1);
  let lead=(first.getDay()+6)%7;
  for(let i=0;i<lead;i++){ const e=document.createElement("div"); e.className="day empty"; grid.appendChild(e); cells.push({el:e,empty:true}); }
  const days=new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
  for(let d=1;d<=days;d++){
    const date=new Date(view.getFullYear(), view.getMonth(), d);
    const past=date<today, busy=BUSY.has(iso(date));
    const el=document.createElement("div"); el.className="day"; el.textContent=d; el.setAttribute("data-full",L().full);
    const cell={el,date,past,busy};
    if(!past){
      el.addEventListener("click",()=>onDayClick(date,busy));
      el.addEventListener("mouseenter",()=>{ if(checkIn&&!checkOut){ hoverDate=date; paintStates(); } });
    }
    grid.appendChild(el); cells.push(cell);
  }
  document.getElementById("prev").disabled=(view.getFullYear()===today.getFullYear() && view.getMonth()===today.getMonth());
  paintStates();
}

function paintStates(){
  const previewing = checkIn && !checkOut && hoverDate && hoverDate>checkIn && !rangeHasBusy(checkIn,hoverDate);
  for(const c of cells){
    if(c.empty){ c.el.className="day empty"; continue; }
    const el=c.el, date=c.date; el.className="day";
    if(c.past){ el.classList.add("disabled"); continue; }
    let isEnd=false, isPrevEnd=false;
    if(checkIn && checkOut){
      if(date>=checkIn && date<checkOut) el.classList.add("night");
      if(sameDay(date,checkIn)) el.classList.add("start");
      if(sameDay(date,checkOut)){ el.classList.remove("night"); el.classList.add("end"); isEnd=true; }
    } else if(previewing){
      if(date>=checkIn && date<hoverDate) el.classList.add("preview");
      if(sameDay(date,checkIn)) el.classList.add("start");
      if(sameDay(date,hoverDate)){ el.classList.remove("preview"); el.classList.add("previewEnd"); isPrevEnd=true; }
    } else if(checkIn && sameDay(date,checkIn)){ el.classList.add("start"); }
    if(c.busy && !isEnd && !isPrevEnd) el.classList.add("busy");
  }
}

function setPrompt(text,warn){ const p=document.getElementById("prompt"); p.innerHTML=text; p.classList.toggle("warn",!!warn); }

function onDayClick(date,busy){
  if(!checkIn || (checkIn && checkOut)){
    if(busy){ setPrompt(L().warnVolArr,true); return; }
    checkIn=date; checkOut=null; setPrompt(L().promptEnd);
  } else {
    if(date<=checkIn){ 
      if(busy){ setPrompt(L().warnVolArr,true); checkIn=null; hoverDate=null; paintStates(); updateSide(); return; }
      checkIn=date; checkOut=null; setPrompt(L().promptEnd);
    } else if(rangeHasBusy(checkIn,date)){
      setPrompt(L().warnVolBetween,true); checkIn=null; checkOut=null;
    } else { checkOut=date; setPrompt(L().promptDone); }
  }
  hoverDate=null; paintStates(); updateSide();
}

function updateSide(){
  const box=document.getElementById("stayBox"); const n=nightsCount(checkIn,checkOut);
  if(checkIn && checkOut){
    box.innerHTML='<div class="line"><span class="lbl">'+L().arrival+'</span><span class="val">'+dLong(checkIn)+'</span></div>'
      +'<div class="line"><span class="lbl">'+L().departure+'</span><span class="val">'+dLong(checkOut)+'</span></div>'
      +'<div class="nights-badge">'+n+' '+(n===1?L().night:L().nights)+'</div>';
  } else if(checkIn){
    box.innerHTML='<div class="line"><span class="lbl">'+L().arrival+'</span><span class="val">'+dLong(checkIn)+'</span></div><div class="empty-msg">'+L().pickDeparture+'</div>';
  } else { box.innerHTML='<div class="empty-msg">'+L().noDates+'</div>'; }

  const stay=n*CONFIG.pricePerNight, tax=n*persons*CONFIG.touristTaxPP;
  document.getElementById("nightsCalc").textContent=L().nightsCalc(n, money(CONFIG.pricePerNight));
  document.getElementById("stayTotal").textContent=money(stay);
  document.getElementById("taxCalc").textContent=L().tax(persons);
  document.getElementById("taxTotal").textContent=money(tax);
  document.getElementById("grandTotal").textContent=money(stay+tax);

  const btn=document.getElementById("payBtn"), reset=document.getElementById("resetBtn");
  if(n>0){ btn.disabled=false; btn.textContent=WIJZIG.on?L().wijzigBtn:L().payBtn(money(stay+tax)); reset.style.display="block"; }
  else { btn.disabled=true; btn.textContent=L().chooseFirst; reset.style.display= checkIn?"block":"none"; }
}

function resetSelection(){ checkIn=null; checkOut=null; hoverDate=null; setPrompt(L().promptStart); paintStates(); updateSide(); }

function applyLang(){
  document.documentElement.lang=lang;
  document.getElementById("title").textContent=L().title;
  document.getElementById("subtitle").textContent=WIJZIG.on?L().wijzigBanner:L().subtitle;
  const dow=document.getElementById("dow"); dow.innerHTML=""; L().dow.forEach(function(d){ const s=document.createElement("span"); s.textContent=d; dow.appendChild(s); });
  document.getElementById("legend").innerHTML=
    '<span><i style="background:var(--green)"></i>'+L().legendNight+'</span>'
    +'<span><i style="background:#fff;border:2px solid var(--green)"></i>'+L().legendDep+'</span>'
    +'<span><i style="background:repeating-linear-gradient(45deg,#fbeee6,#fbeee6 3px,#f6e3d6 3px,#f6e3d6 6px)"></i>'+L().legendFull+'</span>';
  document.getElementById("sideTitle").textContent=L().sideTitle;
  document.getElementById("personsLabel").textContent=L().persons;
  document.getElementById("nameLabel").textContent=L().nameLabel;
  document.getElementById("gName").placeholder=L().namePh;
  document.getElementById("emailLabel").textContent=L().emailLabel;
  document.getElementById("gMail").placeholder=L().emailPh;
  document.getElementById("optinLabel").textContent=L().keepPosted;
  document.getElementById("powerLabel").textContent=L().power;
  document.getElementById("totalLabel").textContent=L().total;
  document.getElementById("hint").textContent=L().hint;
  Array.prototype.forEach.call(document.querySelectorAll("#langs button"),function(b){ b.classList.toggle("active", b.getAttribute("data-lang")===lang); });
  document.getElementById("resetBtn").textContent=L().reset;
  if(!checkIn && !checkOut) setPrompt(L().promptStart);
  else if(checkIn && !checkOut) setPrompt(L().promptEnd);
  else setPrompt(L().promptDone);
  buildGrid(); updateSide();
}

document.getElementById("prev").onclick=()=>{view.setMonth(view.getMonth()-1);buildGrid();loadAvailability(view);};
document.getElementById("next").onclick=()=>{view.setMonth(view.getMonth()+1);buildGrid();loadAvailability(view);};
document.getElementById("pMinus").onclick=()=>{if(persons>1){persons--;document.getElementById("pCount").textContent=persons;updateSide();}};
document.getElementById("pPlus").onclick=()=>{if(persons<12){persons++;document.getElementById("pCount").textContent=persons;updateSide();}};
document.getElementById("resetBtn").onclick=resetSelection;
document.getElementById("grid").addEventListener("mouseleave",()=>{ if(checkIn&&!checkOut){hoverDate=null;paintStates();} });
Array.prototype.forEach.call(document.querySelectorAll("#langs button"),function(b){ b.onclick=function(){ lang=b.getAttribute("data-lang"); applyLang(); }; });

document.getElementById("payBtn").onclick=async ()=>{
  const n=nightsCount(checkIn,checkOut); if(n<1) return;
  const btn=document.getElementById("payBtn"); const oud=btn.textContent;
  const redirect=(u)=>{ (window.top && window.top!==window ? window.top : window).location.href=u; };
  if(WIJZIG.on){
    btn.disabled=true; btn.textContent=L().sending;
    try{
      const params=new URLSearchParams();
      params.set("ref", WIJZIG.ref); params.set("token", WIJZIG.token);
      params.set("aankomst", iso(checkIn)); params.set("nachten", String(n));
      params.set("personen", String(persons)); params.set("taal", lang);
      const res=await fetch(CONFIG.wijzigUrl,{ method:"POST", body:params });
      const data=await res.json().catch(()=>({}));
      if(data && data.gewijzigd){ redirect(data.redirect||"https://buswhisky.com/bedankt"); return; }
      if(data && data.checkoutUrl){ redirect(data.checkoutUrl); return; }
      if(data && data.error==="bijbetalen"){ setPrompt(data.bericht||L().errBijbetalen,true); }
      else if(data && data.error==="vol"){ setPrompt(L().errFull,true); }
      else { setPrompt(L().errPay,true); }
      btn.disabled=false; btn.textContent=oud;
    }catch(e){ setPrompt(L().errConn,true); btn.disabled=false; btn.textContent=oud; }
    return;
  }
  const naam=document.getElementById("gName").value.trim();
  const email=document.getElementById('gMail').value.trim();
  if(!naam || email.indexOf("@")<1){ setPrompt(L().fillNameEmail,true); return; }
  const delen=naam.split(/\s+/); const voornaam=delen.shift()||naam; const achternaam=delen.join(" ");
  btn.disabled=true; btn.textContent=L().sending;
  try{
    const params=new URLSearchParams();
    params.set("aankomst", iso(checkIn)); params.set("nachten", String(n));
    params.set("voornaam", voornaam); params.set("achternaam", achternaam);
    params.set("naam", naam); params.set("email", email); params.set("telefoon", "");
    params.set("personen", String(persons)); params.set("taal", lang);
    params.set("nieuwsbrief", document.getElementById("gOptin").checked ? "1" : "0");
    const res=await fetch(CONFIG.webhookUrl,{ method:"POST", body:params });
    const data=await res.json().catch(()=>({}));
    if(data && data.checkoutUrl){ redirect(data.checkoutUrl); return; }
    if(data && data.error==="vol"){ setPrompt(L().errFull,true); } else { setPrompt(L().errPay,true); }
    btn.disabled=false; btn.textContent=oud;
  }catch(e){ setPrompt(L().errConn,true); btn.disabled=false; btn.textContent=oud; }
};

if(WIJZIG.on){
  var _hf=function(id){ var el=document.getElementById(id); if(el){ var f=el.closest('.field'); if(f) f.style.display='none'; } };
  _hf('gName'); _hf('gMail');
  var _op=document.querySelector('.optin'); if(_op) _op.style.display='none';
}
applyLang();
loadAvailability(today);
</script>
</body>
</html>
